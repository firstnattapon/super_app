name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # Only the stack app-v2 and its tests use; the pins stay in requirements.txt (one place to bump them).
      - name: Install the pinned stack
        run: |
          python -m pip install --upgrade pip
          grep -E '^(streamlit|pandas|numpy|pyarrow|plotly)==' requirements.txt | xargs python -m pip install
      - name: Compile
        run: python -m py_compile engine_v2.py ledger_v2.py learn_v2.py lego_hover_table.py pages/app-v2.py pages/app-v3.py
      - name: Test
        run: python -m unittest discover -s tests -v
